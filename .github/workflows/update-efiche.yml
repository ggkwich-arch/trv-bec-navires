name: Mise à jour e-fiche TRV & BEC
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: node scripts/scrape_efiche.mjs
      - run: |
          git config user.name "e-fiche-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/vessels.json
          git commit -m "Auto-update e-fiche" || exit 0
          git push
